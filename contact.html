<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <style>
   *{
    margin: auto;
    padding: 0;
    box-sizing: border-box;
}
html{
    scroll-behavior: smooth;
}

body{
    font-family: sans-serif;
    line-height: 1.6;
    color: #333;
}

header{
    background-color:#ffffff;
    box-shadow:0 2px 8px rgba(0,0,0,0.8);
}

.navbar{
    max-width: 1100px;
    padding: 20px;
    display:flex;
    justify-content: space-between;
    align-items: center;
    gap: 50px;
}

.logo{
  color: #2563eb;
  font-size: 24px;  
}
.nav-link{
    list-style: none;
}

.nav-link a{
    text-decoration:none;
    color: #333;
    font-weight: bold;
    
}

.nav-link a:hover{
    color: #2563eb;
}

.hero{
    min-height: 450px;
    background: linear-gradient(135deg,#1e3e8a,#3b82f6);
    color:#ffffff;
    display:flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
}

.hero-content{
    max-width: 700px;
}

.hero h1{
    font-size: clamps(32px 5vw, 48px);
    line-height: 1.2;
    margin-bottom: 20px;
}

.hero p{
    font-size: 18px;
    margin-bottom: 30px;
}

.btn{
    display: inline-block;
    background-color: #ffffff;
    color: #2563eb;
    padding: 12px 25px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover{
    background-color: #e5e7eb;
    transform: translateY(-2px);
}

.service{
    padding: 70px 20px;
    text-align: center;
    background-color: #f9fafb;
}

.service h2,
.about h2
.contact h2{
    font-size: 32px;
    margin-bottom: 15px;
}
    .service-description{
        margin-bottom: 35px;
        color: #666;
    }
    .service-container{
        max-width: 1100px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .service-card h3{
        color: #2563eb;
        margin-bottom: 12px;
    }

    .about{
        max-width: 800px;
        margin: auto;
        padding: 70px 20px;
        text-align: center;
    }

    .about p{
        color: #666;
        font-size: 17px;
    }

    .contact{
        background-color: #eff6ff;
        text-align: center;
        padding: 60px 25px;
    }

    .contact p{
        margin-bottom: 25px;
    }
    .contact .btn{
        background-color: #2563eb;
        color: white;
    }

    .contact.btn:hover{
        background-color: #111827;
    }

    footer{
        background-color: #111827;
        color: white;
        text-align: center;
        padding: 20px;
    }
    @media(max-width: 768px){
        .navbar{
            flex-direction:column;
        }
        .nav-link{
            justify-content:center;
            flex-wrap:wrap;
            gap:12px 20px;
        }
        .service-container{
            grid-template-columns:1fr;
        }
        .hero{
            min-height:380px;
        }
    }
 button{
    background: #2563eb;
    display: inline-block;
    border-radius: 6px;
    color: white;
    text-decoration: none;
    height:20px ;
    width: 40px; ;
}
button a{
    text-decoration: none;
    color: #ffffff;
    font-size: 10px;
}
</style>
</head>

</body>
</html>
